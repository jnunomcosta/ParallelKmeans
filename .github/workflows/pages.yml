# Publishes the WebAssembly demo to GitHub Pages.
# One-time setup for the repository owner: Settings -> Pages -> Source: "GitHub Actions".

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: cmake --preset web
      - name: Build
        run: cmake --build --preset web -j
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/apps/gui
      - id: deployment
        uses: actions/deploy-pages@v4
